; /etc/pve-disk-monitor.ini - settings for pve-disk-monitor.sh
;
; Everything is optional: anything not set here uses the default (shown).
; Comments: lines starting with ; or #  (no comments after a value, so regexes
; may contain # and ;). Values may be wrapped in "...".
; Keys marked (repeatable) may be given multiple times.
; Booleans: 1/0, yes/no, true/false, on/off.

[general]
; checks to run (space or comma separated)
checks = disks smart kernel mounts usage zfs lvmthin mdraid btrfs pvesm
;state_dir = /var/lib/pve-disk-monitor
; name used in messages (empty = hostname -s)
;host_label =
;max_msg_len = 900

[kuma]
; Push URL of an Uptime Kuma "Push" monitor. The ?status=... query may stay,
; it is stripped.
push_url = https://kuma.example.nl/api/push/XXXXXXXXXX
; WARN = monitor down on warnings and critical
; CRIT = down on critical only (warnings are included in the 'up' message)
down_severity = WARN
;timeout = 20

[webhook]
; Optional: additional generic JSON POST (Slack/Discord/Gotify/n8n/...).
; Body contains text, content, message, status, critical[], warning[], among others.
;url = https://hooks.example.nl/xyz
; 1 = only send when the problem list changes (including recovery)
;on_change_only = 1
; (repeatable)
;header = Authorization: Bearer abc123

[disks]
; disks to ignore (kernel name, regex)
;exclude_regex = ^(loop|zd|rbd|nbd|sr|dm-|md|ram|zram|drbd)
; Detect disappeared disks: the script remembers which disks were present.
;   all      = all disks (including USB)
;   internal = non-USB disks only
;   none     = off
track = all
; Disks that may be absent without alarm (regex on serial/model/name),
; e.g. rotating offsite backup disks:
;track_ignore_regex = ^(WX12A34B5678|WX98Z76Y5432)$
; Disks that must ALWAYS be present (serial, WWN, model or /dev/disk/by-id name).
; Comma/space separated and/or repeatable. See: pve-disk-monitor.sh --list-disks
;expected = S4EVNX0N123456, WD-WX12A34B5678
;expected = usb-WD_Elements_25A3_575831324133-0:0
; WARN when a disk gets a different name without a reboot (sdc -> sdd = USB reconnect)
;warn_on_rename = 1

[smart]
;timeout = 60
; do not wake sleeping disks (smartctl -n standby)
;nowake = 1
; skip disks for SMART (regex on name/serial/model)
;skip_regex =
; USB bridge without SMART support: INFO (silent) or WARN
;unsupported = INFO
; USB: try these -d types if autodetection gives no SMART data
;usb_try_types = sat sntjmicron sntasmedia sntrealtek
; Extra devices that lsblk does not show as a disk, e.g. behind a RAID controller.
; Format: device|type|label   (repeatable)
;extra = /dev/sda|megaraid,0|bay0
;extra = /dev/sda|megaraid,1|bay1
; WARN when the attribute raw value > threshold (id:threshold)
;   5 Reallocated_Sector_Ct, 187 Reported_Uncorrect,
;   197 Current_Pending_Sector, 198 Offline_Uncorrectable
; If a disk has a few old reallocated sectors that stay stable: set e.g. 5:8
;attr_warn_above = 5:0 187:0 197:0 198:0
; CRIT when these attributes increase compared to the previous run
;attr_crit_increase = 5 197 198
; WARN when these increase (199 UDMA_CRC_Error_Count = cable/USB connection)
;attr_warn_increase = 187 199
; ATA error log grows: WARN, CRIT or IGNORE
;ata_errlog_increase = WARN
; temperature "warn crit" in °C
;temp_hdd = 50 60
;temp_ssd = 60 70
;temp_nvme = 70 80
; NVMe percentage_used (wear) warning
;nvme_wear_warn = 90
;nvme_media_warn_above = 0

[smart.devtype]
; Fixed smartctl -d type per disk (key = serial or kernel name).
;WX12A34B5678 = sat
;sdc = sat,12

[kernel]
; first run: look back this many seconds in the kernel log
;lookback = 3600
; ignore messages in the first N seconds after boot (USB resets during startup)
;boot_grace = 180
; severity of kernel errors found: WARN or CRIT
;severity = WARN
; always CRIT from this many lines per run
;crit_count = 50
; use built-in patterns (I/O error, USB/uas resets, link resets, fs errors, nvme timeouts)
;use_default_patterns = 1
; additional patterns, extended regex (repeatable)
;pattern = SATA link down
;pattern = USB disconnect
; ignore lines matching these (repeatable)
;ignore = usb 1-4: reset full-speed USB device
;ignore = sr0

[mounts]
; mountpoints that must be mounted, writable and not read-only (repeatable)
;path = /mnt/usb-backup
;path = /mnt/pve/backup
; write test (create and remove a small file)
;write_test = 1
;timeout = 15

[usage]
;warn = 85
;crit = 95
;inode_warn = 85
;inode_crit = 95
; filesystem types to check (ZFS is handled by [zfs])
;fstypes_regex = ^(ext[234]|xfs|btrfs|vfat|exfat|ntfs|ntfs3|fuseblk|f2fs)$
; mountpoints to skip (regex)
;exclude_regex = ^/boot/efi$

[usage.thresholds]
; per-mountpoint thresholds: "warn crit"
;/mnt/usb-backup = 95 98

[zfs]
;cap_warn = 80
;cap_crit = 90

[lvmthin]
;data_warn = 85
;data_crit = 95
;meta_warn = 75
;meta_crit = 90

[pvesm]
; only check local storage types for 'inactive'
;types_regex = ^(dir|lvm|lvmthin|zfspool|btrfs)$
;ignore_regex =
