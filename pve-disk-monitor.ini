; /etc/pve-disk-monitor.ini - instellingen voor pve-disk-monitor.sh
;
; Alles is optioneel: wat hier niet staat gebruikt de standaardwaarde (staat erbij).
; Commentaar: regels die beginnen met ; of #  (geen commentaar achter een waarde,
; zodat regexen # en ; mogen bevatten). Waarden mogen tussen "..." staan.
; Sleutels gemarkeerd met (herhaalbaar) mag je meerdere keren opgeven.
; Booleans: 1/0, yes/no, true/false, on/off.

[general]
; welke checks draaien (spatie- of kommagescheiden)
checks = disks smart kernel mounts usage zfs lvmthin mdraid btrfs pvesm
;state_dir = /var/lib/pve-disk-monitor
; naam in meldingen (leeg = hostname -s)
;host_label =
;max_msg_len = 900

[kuma]
; Push-URL van een Uptime Kuma "Push" monitor. De ?status=...-query mag erachter
; blijven staan, die wordt eraf gehaald.
push_url = https://kuma.example.nl/api/push/XXXXXXXXXX
; WARN = monitor down bij waarschuwingen én kritiek
; CRIT = alleen down bij kritiek (waarschuwingen staan dan in de 'up'-melding)
down_severity = WARN
;timeout = 20

[webhook]
; Optioneel: extra generieke JSON POST (Slack/Discord/Gotify/n8n/Home Assistant...).
; Body bevat o.a. text, content, message, status, critical[], warning[].
;url = https://hooks.example.nl/xyz
; 1 = alleen versturen als de lijst met problemen verandert (incl. herstel)
;on_change_only = 1
; (herhaalbaar)
;header = Authorization: Bearer abc123

[disks]
; disks die genegeerd worden (kernelnaam, regex)
;exclude_regex = ^(loop|zd|rbd|nbd|sr|dm-|md|ram|zram|drbd)
; Verdwenen disks detecteren: het script onthoudt welke disks er waren.
;   all      = alle disks (ook USB)
;   internal = alleen niet-USB disks
;   none     = uit
track = all
; Disks die weg mogen zijn zonder alarm (regex op serial/model/naam),
; bv. wisselende offsite backup-disks:
;track_ignore_regex = ^(WX12A34B5678|WX98Z76Y5432)$
; Disks die er ALTIJD moeten zijn (serial, WWN, model of /dev/disk/by-id naam).
; Komma/spatie-gescheiden en/of herhaalbaar. Zie: pve-disk-monitor.sh --list-disks
;expected = S4EVNX0N123456, WD-WX12A34B5678
;expected = usb-WD_Elements_25A3_575831324133-0:0
; WARN als een disk zonder reboot een andere naam krijgt (sdc -> sdd = USB reconnect)
;warn_on_rename = 1

[smart]
;timeout = 60
; slapende disks niet wakker maken (smartctl -n standby)
;nowake = 1
; disks overslaan voor SMART (regex op naam/serial/model)
;skip_regex =
; USB-bridge zonder SMART-ondersteuning: INFO (stil) of WARN
;unsupported = INFO
; USB: deze -d types proberen als autodetectie geen SMART-data geeft
;usb_try_types = sat sntjmicron sntasmedia sntrealtek
; Extra devices die lsblk niet als losse disk ziet, bv. achter een RAID-controller.
; Formaat: device|type|label   (herhaalbaar)
;extra = /dev/sda|megaraid,0|bay0
;extra = /dev/sda|megaraid,1|bay1
; WARN als ruwe waarde van attribuut > drempel (id:drempel)
;   5 Reallocated_Sector_Ct, 187 Reported_Uncorrect,
;   197 Current_Pending_Sector, 198 Offline_Uncorrectable
; Heeft een disk een paar oude reallocated sectors die stabiel blijven: zet bv. 5:8
;attr_warn_above = 5:0 187:0 197:0 198:0
; CRIT als deze attributen stijgen t.o.v. de vorige run
;attr_crit_increase = 5 197 198
; WARN als deze stijgen (199 UDMA_CRC_Error_Count = kabel/USB-verbinding)
;attr_warn_increase = 187 199
; ATA error log groeit: WARN, CRIT of IGNORE
;ata_errlog_increase = WARN
; temperatuur "warn crit" in °C
;temp_hdd = 50 60
;temp_ssd = 60 70
;temp_nvme = 70 80
; NVMe percentage_used (slijtage) waarschuwing
;nvme_wear_warn = 90
;nvme_media_warn_above = 0

[smart.devtype]
; Vast smartctl -d type per disk (sleutel = serial of kernelnaam).
;WX12A34B5678 = sat
;sdc = sat,12

[kernel]
; eerste run: zoveel seconden terugkijken in de kernellog
;lookback = 3600
; meldingen in de eerste N seconden na boot negeren (USB-resets bij opstarten)
;boot_grace = 180
; ernst van gevonden kernelfouten: WARN of CRIT
;severity = WARN
; vanaf zoveel regels per run altijd CRIT
;crit_count = 50
; ingebouwde patronen gebruiken (I/O error, USB/uas resets, link resets, fs errors, nvme timeouts)
;use_default_patterns = 1
; eigen extra patronen, extended regex (herhaalbaar)
;pattern = SATA link down
;pattern = USB disconnect
; regels die hierop matchen negeren (herhaalbaar)
;ignore = usb 1-4: reset full-speed USB device
;ignore = sr0

[mounts]
; mountpoints die gemount, schrijfbaar en niet read-only moeten zijn (herhaalbaar)
;path = /mnt/usb-backup
;path = /mnt/pve/backup
; schrijftest (klein bestand aanmaken en weer verwijderen)
;write_test = 1
;timeout = 15

[usage]
;warn = 85
;crit = 95
;inode_warn = 85
;inode_crit = 95
; filesystem types die gecontroleerd worden (ZFS gaat via [zfs])
;fstypes_regex = ^(ext[234]|xfs|btrfs|vfat|exfat|ntfs|ntfs3|fuseblk|f2fs)$
; mountpoints overslaan (regex)
;exclude_regex = ^/boot/efi$

[usage.thresholds]
; afwijkende drempels per mountpoint: "warn crit"
;/mnt/usb-backup = 95 98

[zfs]
;cap_warn = 80
;cap_crit = 90

[lvmthin]
;data_warn = 85
;data_crit = 95
;meta_warn = 75
;meta_crit = 90

[pvesm]
; alleen lokale storage types controleren op 'inactive'
;types_regex = ^(dir|lvm|lvmthin|zfspool|btrfs)$
;ignore_regex =
